<!doctype html>
<html lang="bn" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sample Clinic Website</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Mulish:wght@400;600;700&family=Noto+Serif+Bengali:wght@500;700&family=Hind+Siliguri:wght@400;500;600&family=Noto+Naskh+Arabic:wght@500;700&family=Tajawal:wght@400;500;700&display=swap">
<style>
  /* Layout: the arched window of the clinic's facade repeats as the page's one shape, on a deep green and ivory field. */
  :root {
    color-scheme: light;
    --green-900: #082e23;
    --green-800: #0b3f30;
    --green-700: #125440;
    --gold: #b7924a;
    --gold-light: #e2c98f;
    --gold-ink: #7a5c1e;
    --ivory: #fbf8ef;
    --sand: #f1ebd9;
    --ink: #17271f;
    --muted: #55655c;
    --line: #dcd4bc;
    --white: #fffdf8;
    --display: "Marcellus", Georgia, "Times New Roman", serif;
    --body: "Mulish", "Segoe UI", system-ui, sans-serif;
    --lh: 1.6;
    --h-lh: 1.12;
  }
  html[lang="bn"] { --display: "Noto Serif Bengali", "Nirmala UI", Georgia, serif; --body: "Hind Siliguri", "Nirmala UI", "Segoe UI", sans-serif; --lh: 1.7; --h-lh: 1.3; }
  html[lang="ar"] { --display: "Noto Naskh Arabic", "Traditional Arabic", Georgia, serif; --body: "Tajawal", "Segoe UI", Tahoma, sans-serif; --lh: 1.75; --h-lh: 1.35; }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 90px; }
  body { margin: 0; background: var(--ivory); color: var(--ink); font: 400 17px/var(--lh) var(--body); }
  h1, h2, h3, p { margin: 0; }
  h1, h2 { font-family: var(--display); font-weight: 500; line-height: var(--h-lh); text-wrap: balance; }
  h2 { font-size: clamp(1.9rem, 3.6vw, 3rem); color: var(--green-800); }
  h3 { font-size: 1.1rem; font-weight: 600; line-height: 1.4; }
  a { color: inherit; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; border-radius: 4px; }
  .wrap { width: min(1200px, 100%); margin-inline: auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
  section { padding-block: clamp(64px, 8vw, 112px); }
  .eyebrow { font-size: .8rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--gold-ink); }
  html[lang="bn"] .eyebrow, html[lang="ar"] .eyebrow { letter-spacing: 0; font-size: .95rem; }
  .section-head { display: grid; gap: 12px; max-width: 680px; margin-bottom: clamp(32px, 4vw, 52px); }
  .section-head p:last-child:not(.eyebrow) { color: var(--muted); }
  .confirm { display: block; font-size: .8rem; color: var(--gold-ink); margin-top: 8px; font-family: "Mulish", "Segoe UI", sans-serif; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; border: 1px solid transparent; padding: 13px 24px; border-radius: 2px; font-weight: 700; text-decoration: none; transition: background .2s, color .2s, border-color .2s; }
  .btn-gold { background: var(--gold-light); color: var(--green-900); }
  .btn-gold:hover { background: #efdbab; }
  .btn-green { background: var(--green-800); color: var(--white); }
  .btn-green:hover { background: var(--green-700); }
  .btn-ghost { border-color: rgba(226, 201, 143, .55); color: var(--white); }
  .btn-ghost:hover { background: rgba(226, 201, 143, .14); }

  .proto { background: var(--green-900); color: var(--gold-light); font-size: .82rem; text-align: center; padding: 6px 16px; font-family: "Mulish", "Segoe UI", sans-serif; }

  header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(251, 248, 239, .96); border-bottom: 1px solid var(--line); }
  .bar { display: flex; align-items: center; gap: 24px; min-height: 76px; }
  .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; min-width: 0; }
  .emblem { flex: none; width: 46px; height: 52px; padding-top: 6px; display: grid; place-items: center; border-radius: 23px 23px 2px 2px; background: var(--green-800); color: var(--gold-light); font: 500 .95rem "Marcellus", Georgia, serif; }
  .brand-name { font-family: var(--display); font-size: 1.1rem; color: var(--green-800); line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar .btn { white-space: nowrap; padding: 11px 20px; }
  nav.links a { white-space: nowrap; }
  .brand-name small { display: block; font-family: var(--body); font-size: .76rem; color: var(--muted); }
  nav.links { display: flex; gap: 22px; margin-inline-start: auto; font-size: .94rem; font-weight: 600; }
  nav.links a { text-decoration: none; padding-block: 6px; border-bottom: 1px solid transparent; }
  nav.links a:hover { border-color: var(--gold); }
  .langs { display: flex; border: 1px solid var(--line); border-radius: 2px; flex: none; }
  .langs button { background: none; border: 0; padding: 6px 10px; font-size: .86rem; font-weight: 600; font-family: "Hind Siliguri", "Nirmala UI", "Segoe UI", Tahoma, sans-serif; }
  .langs button[aria-pressed="true"] { background: var(--green-800); color: var(--white); }

  .hero { background: radial-gradient(90% 120% at 85% 10%, var(--green-700), var(--green-800) 55%, var(--green-900)); color: var(--white); padding-block: clamp(48px, 6vw, 84px) clamp(110px, 10vw, 140px); overflow: hidden; }
  .hero-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); align-items: end; gap: clamp(32px, 6vw, 80px); }
  .hero .eyebrow { color: var(--gold-light); }
  .hero-copy { display: grid; gap: 22px; padding-bottom: 16px; animation: rise .7s ease-out both; }
  h1 { font-size: clamp(2.5rem, 5.6vw, 4.7rem); }
  .lede { font-size: 1.15rem; color: #dfe7df; max-width: 34em; }
  .cta { display: flex; flex-wrap: wrap; gap: 12px; }
  .arch-frame { position: relative; justify-self: end; width: min(100%, 430px); padding: 12px; border: 1px solid var(--gold); border-radius: 215px 215px 0 0; border-bottom: 0; margin-bottom: calc(-1 * clamp(110px, 10vw, 140px)); animation: rise .9s ease-out both; }
  .arch { aspect-ratio: 520 / 660; border-radius: 205px 205px 0 0; background-image: url("assets/facade.svg"); background-size: cover; background-position: center bottom; background-repeat: no-repeat; background-color: var(--green-700); }
  @keyframes rise { from { transform: translateY(14px); } }

  .answers-band { padding-block: 0; }
  .answers { position: relative; z-index: 2; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--white); border: 1px solid var(--line); border-top: 3px solid var(--gold); margin-top: -64px; box-shadow: 0 24px 50px -28px rgba(8, 46, 35, .4); }
  .answer { padding: 24px 22px; display: grid; gap: 6px; align-content: start; min-width: 0; }
  .answer + .answer { border-inline-start: 1px solid var(--line); }
  .answer .q { font-size: .86rem; font-weight: 700; color: var(--gold-ink); }
  .answer p { font-size: .98rem; }

  .offer-wrap { padding-bottom: 0; }
  .offer { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: clamp(28px, 5vw, 64px); align-items: center; background: var(--sand); border: 1px solid var(--line); padding: clamp(28px, 5vw, 56px); }
  .offer-copy { display: grid; gap: 14px; justify-items: start; }
  .offer-copy p { color: var(--muted); max-width: 34em; }
  .deals { display: grid; gap: 14px; }
  .deal { display: flex; align-items: center; gap: 18px; background: var(--green-800); color: var(--white); padding: 18px 22px; border-radius: 80px 80px 2px 2px; }
  .deal b { font-family: var(--display); font-weight: 500; font-size: 2.3rem; color: var(--gold-light); line-height: 1.1; flex: none; }
  .deal span { font-size: 1rem; line-height: 1.35; }

  .groups { display: grid; grid-template-columns: 1.5fr 1fr; gap: clamp(28px, 5vw, 64px); }
  .group-title { font-size: .86rem; font-weight: 700; color: var(--gold-ink); padding-bottom: 10px; border-bottom: 1px solid var(--gold); }
  .dept-list { list-style: none; margin: 0; padding: 0; }
  .dept-list.two { display: grid; grid-template-columns: 1fr 1fr; column-gap: 28px; }
  .dept { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 14px 2px; text-align: start; font-family: var(--display); font-size: 1.22rem; color: var(--green-800); transition: padding .2s, color .2s; }
  button.dept:hover { padding-inline-start: 10px; color: var(--gold-ink); }
  .dept i { font-style: normal; color: var(--gold); font-family: "Segoe UI", sans-serif; }
  [dir="rtl"] .dept i { transform: scaleX(-1); }
  .emergency { display: grid; gap: 4px; margin-top: 22px; background: var(--green-800); color: var(--white); padding: 18px 20px; }
  .emergency b { font-family: var(--display); font-weight: 500; font-size: 1.22rem; color: var(--gold-light); }
  .emergency span { font-size: .94rem; }

  .care { background: var(--green-800); color: var(--white); }
  .care h2 { color: var(--white); }
  .care .eyebrow { color: var(--gold-light); }
  .care .section-head p:last-child:not(.eyebrow) { color: #cfdcd3; }
  .tongues { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border-top: 1px solid rgba(226, 201, 143, .45); }
  .tongue { padding: 26px 24px 8px 0; display: grid; gap: 10px; align-content: start; min-width: 0; }
  [dir="rtl"] .tongue { padding: 26px 0 8px 24px; }
  .tongue + .tongue { border-inline-start: 1px solid rgba(226, 201, 143, .25); padding-inline-start: 24px; }
  .tongue .native { font-family: "Noto Serif Bengali", "Noto Naskh Arabic", "Nirmala UI", Georgia, serif; font-size: 1.7rem; color: var(--gold-light); line-height: 1.3; }
  .tongue p { color: #dfe7df; font-size: .98rem; }
  .care .confirm { color: var(--gold-light); }

  .steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(20px, 3vw, 40px); counter-reset: s; }
  .steps li { counter-increment: s; display: grid; gap: 10px; align-content: start; }
  .steps li::before { content: counter(s); font-family: var(--display); font-size: 1.3rem; width: 52px; height: 64px; display: grid; place-items: center; padding-top: 6px; color: var(--green-800); border: 1px solid var(--gold); border-radius: 26px 26px 0 0; }
  .steps p { color: var(--muted); font-size: .98rem; }

  .visit { background: var(--sand); }
  .visit-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: clamp(28px, 5vw, 64px); align-items: center; }
  .photo { aspect-ratio: 620 / 400; background-image: url("assets/facade.svg"); background-size: cover; background-position: center 72%; background-repeat: no-repeat; border-radius: 240px 240px 0 0; }
  .visit-copy { display: grid; gap: 22px; }
  .info { display: grid; gap: 14px; margin: 0; }
  .info div { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
  .info dt { font-weight: 700; color: var(--gold-ink); font-size: .9rem; }
  .info dd { margin: 0; }
  .num { direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums; }
  .qr-row { display: flex; align-items: center; gap: 16px; }
  .qr { flex: none; width: 104px; height: 104px; display: grid; place-items: center; border: 1px dashed var(--gold); color: var(--gold-ink); font-weight: 700; letter-spacing: .08em; font-family: "Mulish", "Segoe UI", sans-serif; }

  .faq { display: grid; max-width: 820px; }
  details { border-bottom: 1px solid var(--line); }
  summary { cursor: pointer; padding: 18px 28px 18px 2px; font-family: var(--display); font-size: 1.2rem; color: var(--green-800); list-style: none; position: relative; }
  [dir="rtl"] summary { padding: 18px 2px 18px 28px; }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "+"; position: absolute; inset-inline-end: 4px; top: 16px; color: var(--gold); font-size: 1.4rem; font-family: "Segoe UI", sans-serif; }
  details[open] summary::after { content: "−"; }
  details p { padding: 0 2px 20px; color: var(--muted); max-width: 42em; }

  footer { background: var(--green-900); color: #cfdcd3; padding-block: 48px 32px; font-size: .94rem; }
  .foot { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 32px; }
  .foot b { display: block; color: var(--gold-light); font-family: var(--display); font-weight: 500; font-size: 1.15rem; margin-bottom: 8px; }
  .foot-note { margin-top: 32px; padding-top: 18px; border-top: 1px solid rgba(226, 201, 143, .25); font-size: .84rem; }

  dialog { width: min(520px, calc(100vw - 32px)); border: 0; border-top: 3px solid var(--gold); padding: 0; background: var(--white); color: var(--ink); box-shadow: 0 30px 80px rgba(8, 46, 35, .45); }
  dialog::backdrop { background: rgba(8, 46, 35, .6); }
  .dlg { padding: 28px; display: grid; gap: 18px; }
  .dlg-head { display: flex; justify-content: space-between; align-items: start; gap: 16px; }
  .dlg-head h2 { font-size: 1.7rem; }
  .x { background: none; border: 0; font-size: 1.5rem; line-height: 1; padding: 4px 8px; color: var(--muted); font-family: "Segoe UI", sans-serif; }
  .field { display: grid; gap: 6px; }
  .field label { font-weight: 600; font-size: .92rem; }
  select { font: inherit; padding: 11px 12px; border: 1px solid var(--line); background: var(--ivory); color: var(--ink); border-radius: 2px; width: 100%; }
  .preview { background: #e3f6dc; padding: 12px 14px; border-radius: 8px; white-space: pre-line; font-size: .98rem; }
  .small { font-size: .85rem; color: var(--muted); }

  @media (max-width: 1160px) {
    nav.links { display: none; }
    .langs { margin-inline-start: auto; }
  }
  @media (max-width: 960px) {
    .bar > .btn { display: none; }
    .hero-grid { grid-template-columns: minmax(0, 1fr); }
    .hero { padding-bottom: 96px; }
    .arch-frame { justify-self: center; width: min(100%, 340px); margin-bottom: -96px; border-radius: 170px 170px 0 0; }
    .arch { border-radius: 160px 160px 0 0; }
    .answers { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 24px; }
    .answers-band .wrap { padding-top: 76px; }
    .answer:nth-child(3) { border-inline-start: 0; }
    .answer:nth-child(n+3) { border-top: 1px solid var(--line); }
    .offer, .groups, .visit-grid { grid-template-columns: minmax(0, 1fr); }
    .foot { grid-template-columns: minmax(0, 1fr); }
    .tongues, .steps { grid-template-columns: minmax(0, 1fr); }
    .tongue, [dir="rtl"] .tongue { padding: 22px 0; }
    .tongue + .tongue { border-inline-start: 0; border-top: 1px solid rgba(226, 201, 143, .25); padding-inline-start: 0; }
  }
  @media (max-width: 560px) {
    body { font-size: 16px; }
    .brand-name small { display: none; }
    .brand-name { font-size: .86rem; white-space: normal; }
    .bar { gap: 12px; }
    .answers { grid-template-columns: minmax(0, 1fr); }
    .answer + .answer { border-inline-start: 0; border-top: 1px solid var(--line); }
    .dept-list.two { grid-template-columns: minmax(0, 1fr); }
    .cta .btn { width: 100%; }
    .info div { grid-template-columns: minmax(0, 1fr); gap: 2px; }
    .deal b { font-size: 1.9rem; }
  }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .hero-copy, .arch-frame { animation: none; } * { transition: none !important; } }
</style>
</head>
<body>
<div class="proto" data-t="proto"></div>

<header class="top">
  <div class="wrap bar">
    <a class="brand" href="#home">
      <span class="emblem" role="img" aria-label="Sample clinic logo">SM</span>
      <span class="brand-name"><span data-t="clinic"></span><small data-t="city"></small></span>
    </a>
    <nav class="links" aria-label="Main">
      <a href="#departments" data-t="navDept"></a>
      <a href="#languages" data-t="navDoc"></a>
      <a href="#offer" data-t="navOffer"></a>
      <a href="#visit" data-t="navVisit"></a>
    </nav>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" data-lang="bn" lang="bn">বাংলা</button>
      <button type="button" data-lang="en" lang="en">EN</button>
      <button type="button" data-lang="ar" lang="ar">عربي</button>
    </div>
    <button type="button" class="btn btn-green" data-book data-t="book"></button>
  </div>
</header>

<main id="home">
  <div class="hero">
    <div class="wrap hero-grid">
      <div class="hero-copy">
        <p class="eyebrow" data-t="tagline"></p>
        <h1 data-t="heroTitle"></h1>
        <p class="lede" data-t="heroLede"></p>
        <div class="cta">
          <button type="button" class="btn btn-gold" data-book data-t="bookWa"></button>
          <a class="btn btn-ghost" href="#departments" data-t="seeDept"></a>
        </div>
      </div>
      <div class="arch-frame">
        <div class="arch" role="img" data-t-label="photoAlt"></div>
      </div>
    </div>
  </div>

  <section class="answers-band" aria-label="Quick answers">
    <div class="wrap">
      <div class="answers">
        <div class="answer"><span class="q" data-t="qHours"></span><p data-t="aHours"></p><span class="confirm">Sample data</span></div>
        <div class="answer"><span class="q" data-t="qWhere"></span><p data-t="aWhere"></p></div>
        <div class="answer"><span class="q" data-t="qFee"></span><p data-t="aFee"></p></div>
        <div class="answer"><span class="q" data-t="qIns"></span><p data-t="aIns"></p><span class="confirm">Sample data</span></div>
      </div>
    </div>
  </section>

  <section class="offer-wrap" id="offer" aria-labelledby="offerTitle">
    <div class="wrap">
      <div class="offer">
        <div class="offer-copy">
          <p class="eyebrow" data-t="offerEyebrow"></p>
          <h2 id="offerTitle" data-t="offerTitle"></h2>
          <p data-t="offerBody"></p>
          <button type="button" class="btn btn-green" data-book="friday" data-t="offerCta"></button>
        </div>
        <div class="deals">
          <div class="deal"><b data-t="dealFree"></b><span data-t="dealFreeText"></span></div>
          <div class="deal"><b data-t="dealPct"></b><span data-t="dealPctText"></span></div>
        </div>
      </div>
    </div>
  </section>

  <section id="departments" aria-labelledby="deptTitle">
    <div class="wrap">
      <div class="section-head">
        <p class="eyebrow" data-t="deptEyebrow"></p>
        <h2 id="deptTitle" data-t="deptTitle"></h2>
        <p data-t="deptBody"></p>
      </div>
      <div class="groups">
        <div>
          <div class="group-title" data-t="groupClinics"></div>
          <ul class="dept-list two" id="deptClinics"></ul>
        </div>
        <div>
          <div class="group-title" data-t="groupTests"></div>
          <ul class="dept-list" id="deptTests"></ul>
          <div class="emergency"><b data-t="emTitle"></b><span data-t="emBody"></span></div>
        </div>
      </div>
    </div>
  </section>

  <section class="care" id="languages" aria-labelledby="careTitle">
    <div class="wrap">
      <div class="section-head">
        <p class="eyebrow" data-t="careEyebrow"></p>
        <h2 id="careTitle" data-t="careTitle"></h2>
        <p data-t="careBody"></p>
      </div>
      <div class="tongues">
        <div class="tongue"><div class="native" lang="bn">বাংলা</div><p data-t="careBn"></p><span class="confirm">Sample data</span></div>
        <div class="tongue"><div class="native" lang="ar">العربية</div><p data-t="careAr"></p><span class="confirm">Sample data</span></div>
        <div class="tongue"><div class="native" lang="en">English</div><p data-t="careEn"></p><span class="confirm">Sample data</span></div>
      </div>
    </div>
  </section>

  <section aria-labelledby="howTitle">
    <div class="wrap">
      <div class="section-head">
        <p class="eyebrow" data-t="howEyebrow"></p>
        <h2 id="howTitle" data-t="howTitle"></h2>
      </div>
      <ol class="steps">
        <li><h3 data-t="s1t"></h3><p data-t="s1b"></p></li>
        <li><h3 data-t="s2t"></h3><p data-t="s2b"></p></li>
        <li><h3 data-t="s3t"></h3><p data-t="s3b"></p></li>
      </ol>
    </div>
  </section>

  <section class="visit" id="visit" aria-labelledby="visitTitle">
    <div class="wrap visit-grid">
      <div class="photo" role="img" data-t-label="entranceAlt"></div>
      <div class="visit-copy">
        <div class="section-head" style="margin:0">
          <p class="eyebrow" data-t="visitEyebrow"></p>
          <h2 id="visitTitle" data-t="visitTitle"></h2>
        </div>
        <dl class="info">
          <div><dt data-t="lAddress"></dt><dd data-t="address"></dd></div>
          <div><dt data-t="lPhone"></dt><dd><span class="num">050 000 0000</span></dd></div>
          <div><dt data-t="lHours"></dt><dd data-t="aHoursFull"></dd></div>
        </dl>
        <div class="qr-row">
          <div class="qr" role="img" data-t-label="qrAlt">QR</div>
          <p data-t="qrText"></p>
        </div>
      </div>
    </div>
  </section>

  <section aria-labelledby="faqTitle">
    <div class="wrap">
      <div class="section-head">

      faq: [['هل المجمع مفتوح الآن؟', 'نعم. المواعيد موضحة أعلاه، ويفضل مراسلتنا عبر واتساب قبل الحضور.'], ['كم الرسوم؟', 'يتيح العرض النموذجي الحالي أول استشارة مجانية وخصم 25% على التحاليل. راسلنا عبر واتساب لمعرفة الرسوم الأخرى.'], ['هل تقبلون التأمين؟', 'أرسل بيانات تأمينك عبر واتساب وسيتحقق موظفونا منها.'], ['هل يتحدث جميع الأطباء البنغالية؟', 'لا. يعمل الأطباء المتحدثون بالبنغالية هنا إلى جانب أطباء آخرين.']],
      footContact: 'تواصل معنا', footWa: 'الاتصال وواتساب', footJobs: 'انضم إلينا', footJobsText: 'نبحث عن ممرضين.',
      footNote: 'Website template by Metanor. All clinic details are sample data.',
      dlgTitle: 'احجز موعداً', fDept: 'القسم', fDay: 'اليوم', fTime: 'الوقت', fSubmit: 'تجهيز رسالة واتساب',
      days: ['الجمعة (العرض)', 'يوم آخر'], times: ['صباحاً', 'ظهراً', 'مساءً'],
      doneIntro: 'رسالتك جاهزة:', doneBtn: 'إغلاق',
      msg: (d, day, t) => `السلام عليكم. أرغب في حجز موعد.\nالقسم: ${d}\nاليوم: ${day}\nالوقت: ${t}`
    }
  };

  const $ = id => document.getElementById(id);
  const dlg = $('dlg');
  let lang = 'bn';
  try { const saved = localStorage.getItem('sample-clinic-lang'); if (T[saved]) lang = saved; } catch (e) {}
  const x = () => T[lang];

  function fill(select, items, keep) {
    const prev = keep ? select.selectedIndex : 0;
    select.textContent = '';
    items.forEach(v => { const o = document.createElement('option'); o.textContent = v; select.append(o); });
    select.selectedIndex = Math.max(0, prev);
  }
  const bookable = () => [...x().clinics, ...x().tests];

  function deptButtons(id, items, offset) {
    const ul = $(id);
    ul.textContent = '';
    items.forEach((name, i) => {
      const li = document.createElement('li');
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'dept';
      const s = document.createElement('span'); s.textContent = name;
      const a = document.createElement('i'); a.textContent = '→'; a.setAttribute('aria-hidden', 'true');
      b.append(s, a);
      b.addEventListener('click', () => openBooking(offset + i));
      li.append(b);
      ul.append(li);
    });
  }

  function render() {
    const d = x();
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.querySelectorAll('[data-t]').forEach(n => { n.textContent = d[n.dataset.t]; });
    document.querySelectorAll('[data-t-label]').forEach(n => n.setAttribute('aria-label', d[n.dataset.tLabel]));
    document.querySelectorAll('.langs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
    deptButtons('deptClinics', d.clinics, 0);
    deptButtons('deptTests', d.tests, d.clinics.length);
    const faq = $('faq');
    faq.textContent = '';
    d.faq.forEach(([q, a], i) => {
      const det = document.createElement('details');
      if (i === 0) det.open = true;
      const s = document.createElement('summary'); s.textContent = q;
      const p = document.createElement('p'); p.textContent = a;
      det.append(s, p);
      faq.append(det);
    });
    fill($('fDept'), bookable(), true);
    fill($('fDay'), d.days, true);
    fill($('fTime'), d.times, true);
  }

  function openBooking(deptIndex, friday) {
    $('dlgFields').hidden = false;
    $('dlgDone').hidden = true;
    $('dlgFields').style.display = 'grid';
    if (deptIndex != null) $('fDept').selectedIndex = deptIndex;
    $('fDay').selectedIndex = friday ? 0 : $('fDay').selectedIndex;
    dlg.showModal();
  }

  document.querySelectorAll('[data-book]').forEach(b => b.addEventListener('click', () => openBooking(null, b.dataset.book === 'friday')));
  document.querySelectorAll('.langs button').forEach(b => b.addEventListener('click', () => {
    lang = b.dataset.lang;
    try { localStorage.setItem('sample-clinic-lang', lang); } catch (e) {}
    render();
  }));
  $('dlgClose').addEventListener('click', () => dlg.close());
  $('dlgDoneBtn').addEventListener('click', () => dlg.close());
  dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
  $('bookForm').addEventListener('submit', e => {
    e.preventDefault();
    const d = x();
    $('preview').textContent = d.msg($('fDept').value, $('fDay').value, $('fTime').value);
    $('dlgFields').hidden = true;
    $('dlgFields').style.display = '';
    $('dlgDone').hidden = false;
  });

  render();
})();
</script>
</body>
</html>
