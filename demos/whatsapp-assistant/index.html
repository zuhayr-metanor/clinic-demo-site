<style>
  /* Layout: mobile first. The patient's phone, then the example chats, then what staff would see. Three columns on wide screens. */
  :root {

  .tab[aria-selected="true"] { background: var(--petrol-800); color: #fff; box-shadow: 0 6px 14px -8px rgba(8,46,35,.6); }

  .phone-col { grid-area: phone; min-width: 0; }
  .controls { grid-area: controls; }
  .clinic-wrap { grid-area: clinic; min-width: 0; display: grid; gap: 10px; }
  .column { display: grid; gap: 12px; min-width: 0; align-content: start; }

  .hint { color: var(--muted); font-size: 13px; margin-bottom: 10px; }

  .explain { background: var(--coral-soft); border-color: #ecdcb2; }
  .explain h2 { color: var(--coral-deep); }

  .scen { display: flex; flex-wrap: wrap; gap: 7px; }
  .scen .group { flex-basis: 100%; font-size: 12.5px; font-weight: 600; color: var(--muted); margin-top: 6px; }
  .scen .group:first-child { margin-top: 0; }
  .scen button { display: inline-flex; align-items: center; gap: 6px; background: #fff; border: 1px solid #b9d9c7; color: #075e49; border-radius: 999px; padding: 6px 13px; font-size: 13.5px; font-weight: 500; min-height: 38px; text-align: start; }
  .scen button:hover { background: var(--ok-soft); }

  .scen .lock { font-size: 11px; font-weight: 600; color: var(--coral-deep); background: var(--coral-soft); border-radius: 999px; padding: 1px 7px; }
  .reset { width: 100%; margin-top: 12px; background: transparent; border: 1px dashed var(--line); border-radius: 10px; padding: 8px; color: var(--muted); font-size: 13.5px; }

  .phone { background: var(--wa-bg); border-radius: 18px; overflow: hidden; box-shadow: 0 18px 36px -24px rgba(8,46,35,.6); border: 1px solid #d8d0c3; }

  .sender { display: block; font-size: 12px; font-weight: 600; color: var(--petrol-600); }
  .time { display: block; text-align: end; font-size: 10.5px; color: #667781; direction: ltr; }
  .ticket { background: var(--ok-soft); border-radius: 8px; padding: 7px 10px; margin-top: 6px; white-space: normal; }
  .ticket b { display: block; font-size: 20px; color: var(--ok); direction: ltr; text-align: start; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 3px 0; }

  @keyframes pop { from { transform: translateY(4px); } }
  @keyframes blink { 50% { opacity: .3; } }

  .stat { background: var(--page); border-radius: 10px; padding: 8px 10px; min-width: 0; }

  .empty { color: var(--muted); font-size: 13.5px; }
  .feed li { font-size: 13px; padding-inline-start: 13px; position: relative; }
  .feed li::before { content: ""; position: absolute; inset-inline-start: 0; top: 8px; width: 6px; height: 6px; background: var(--petrol-600); border-radius: 50%; }
  .sched { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .sched th { text-align: start; font-weight: 500; color: var(--muted); font-size: 12.5px; padding: 0 6px 4px 0; }
  .sched td { border-top: 1px solid var(--line); padding: 6px 6px 6px 0; }
  .sched .t { direction: ltr; unicode-bidi: isolate; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .sched tr.new td { background: var(--ok-soft); }
  .tscroll { overflow-x: auto; }
  .bars { display: grid; gap: 8px; }
  .bars .row { display: flex; justify-content: space-between; gap: 8px; font-size: 13.5px; margin-bottom: 2px; }
  .bars .row b { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; white-space: nowrap; }
  .track { height: 8px; background: var(--mist); border-radius: 4px; overflow: hidden; }
  .fill { height: 100%; background: var(--petrol-600); border-radius: 4px; transition: width .3s; }
  .total { display: flex; justify-content: space-between; gap: 8px; border-top: 1px solid var(--line); margin-top: 10px; padding-top: 8px; font-weight: 600; }
  .total b { font: 700 1.2rem var(--display); color: var(--ok); direction: ltr; unicode-bidi: isolate; white-space: nowrap; }

  .compare-wrap { max-width: 1040px; margin-inline: auto; padding-block: 18px 34px; scroll-margin-top: 10px; }
  .compare-card { background: var(--panel); border-radius: 22px; overflow: hidden; box-shadow: 0 24px 44px -34px rgba(8,46,35,.6); border: 1px solid var(--line); }
  .compare-head { padding: 20px 18px 6px; display: grid; gap: 6px; }
  .compare-head h2 { font: 700 clamp(1.35rem, 4.5vw, 1.9rem)/1.2 var(--display); color: var(--petrol-800); }
  .compare-head p { color: var(--muted); font-size: 14px; }
  .cmp { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; font-size: 13.5px; }
  .cmp col.feat { width: 40%; }
  .cmp thead th { position: sticky; top: 0; z-index: 1; background: var(--panel); padding: 14px 2px 12px; text-align: center; vertical-align: bottom; border-bottom: 1px solid var(--line); }
  .cmp thead th:first-child { text-align: start; padding-inline-start: 18px; color: var(--muted); font-weight: 500; font-size: 12.5px; }
  .cmp thead b { display: block; font: 600 .8rem/1.25 var(--display); color: var(--petrol-800); overflow-wrap: normal; word-break: keep-all; }
  .cmp thead button { margin-top: 8px; border: 1px solid var(--petrol-600); background: #fff; color: var(--petrol-800); border-radius: 999px; padding: 4px 8px; font-size: 12px; font-weight: 600; min-height: 32px; width: min(100%, 92px); }
  .cmp thead th.cur { background: var(--petrol-800); border-radius: 14px 14px 0 0; }
  .cmp thead th.cur b { color: #fff; }
  .cmp thead th.cur button { background: var(--gold); border-color: var(--gold); color: var(--petrol-900); }
  .cmp tr.grp th { text-align: start; padding: 16px 18px 6px; font-size: 12px; font-weight: 600; color: var(--coral-deep); background: transparent; }
  .cmp tr.grp td.cur { background: var(--petrol-800); }
  .cmp tbody th[scope="row"] { text-align: start; font-weight: 400; padding: 9px 6px 9px 18px; border-top: 1px solid var(--line); }
  [dir="rtl"] .cmp tbody th[scope="row"] { padding: 9px 18px 9px 6px; }
  .cmp tbody th b { display: block; font-weight: 600; line-height: 1.35; }
  .cmp tbody th small { display: block; color: var(--muted); font-size: 12px; line-height: 1.35; }
  .cmp td { text-align: center; border-top: 1px solid var(--line); }
  .cmp td.cur { background: var(--petrol-800); border-top-color: rgba(255,255,255,.12); }
  .cmp .y { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--ok-soft); color: var(--ok); font-weight: 700; font-size: 13px; }
  .cmp td.cur .y { background: var(--gold); color: var(--petrol-900); }
  .cmp .n { color: #a4b5aa; }

  .cmp-foot { padding: 14px 18px 18px; color: var(--muted); font-size: 12.5px; }

  @media (min-width: 640px) {
    .tab span { display: block; font-size: 12px; color: inherit; opacity: .75; margin-top: 2px; }

    .screen { border-radius: 22px; overflow: hidden; background: var(--wa-bg); height: min(700px, calc(100vh - 40px)); }

  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .msg, .typing i { animation: none; } .fill { transition: none; } }

  /* Metanor Clinic Suite lockup in the bar */
  .suite-lock { display: inline-flex; align-items: center; gap: 9px; color: #fff; text-decoration: none; direction: ltr; flex: none; }
  .suite-lock img { display: block; height: 17px; width: auto; }
  .suite-lock span { font: 600 13px/1 "Bricolage Grotesque", "Segoe UI", sans-serif; padding-left: 9px; border-left: 1.5px solid rgba(255,255,255,.7); white-space: nowrap; }
  .top h1 { flex: 1 1 auto; }
  @media (max-width: 640px) { .top h1 { flex-basis: 100%; } }

  .side-note { font-size: 13px; color: var(--muted); margin: 2px 2px 10px; line-height: 1.45; }
  .booked-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .booked-list li { padding: 9px 11px; border-radius: 10px; background: var(--ok-soft); font-size: 13.5px; line-height: 1.4; }
  .booked-list b { display: block; }
</style>
</head>
<body>
<div class="banner gutter" id="banner"></div>

<header class="top gutter">
  <div class="top-inner">
    <a class="suite-lock" href="../../" aria-label="Metanor Clinic Suite"><img src="../../assets/metanor-logo-white.svg" alt="Metanor" width="514" height="96"><span>Clinic Suite</span></a>
    <h1 id="pageTitle"></h1>
    <div class="top-actions">
      <a id="siteLink" href="../../"></a>
      <div class="langs" role="group" aria-label="Language">
        <button type="button" data-lang="en">English</button>
        <button type="button" data-lang="ar">العربية</button>
        <button type="button" data-lang="bn">বাংলা</button>
      </div>
    </div>
  </div>
</header>

<main class="layout gutter">
  <section class="phone-col" aria-label="Patient chat">
    <div class="phone">
      <div class="screen">
        <header class="chat-head">
          <div class="avatar" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 40 40"><path d="M16 6h8v10h10v8H24v10h-8V24H6v-8h10z" fill="#0b3f30"/></svg></div>
          <div class="who"><b id="clinicName"></b><span id="clinicStatus"></span></div>
        </header>
        <div class="log" id="log" role="log" aria-live="polite"></div>
        <form class="composer" id="composer">
          <input id="input" autocomplete="off">
          <button type="submit" id="send"></button>
        </form>
      </div>
    </div>
  </section>

  <div class="column controls">
    <div class="panel">
      <h2 id="scenTitle"></h2>
      <p class="hint" id="scenHint"></p>
      <div class="scen" id="scen"></div>
      <button class="reset" id="reset" type="button"></button>
    </div>
    <div class="panel explain" aria-live="polite">
      <h2 id="explainTitle"></h2>
      <p id="explain"></p>
    </div>
  </div>

  <div class="clinic-wrap">
    <h2 class="side-title" id="clinicSide"></h2>
    <p class="side-note" id="clinicNote"></p>
    <div class="column clinic" id="clinic" aria-label="Clinic view"></div>
  </div>
</main>

<script>

  const esc = w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const RX = new Map();
  function has(text, word) {
    const w = word.normalize('NFC');
    if (!/^[a-z]/.test(w.trim())) return text.includes(w);
    if (!RX.has(w)) {
      const raw = w.trim(), pre = raw.endsWith('*');
      RX.set(w, new RegExp('(?:^|[^a-z])' + esc(pre ? raw.slice(0, -1) : raw) + (pre ? '' : '(?![a-z])')));
    }
    return RX.get(w).test(text);
  }
  const any = (text, words) => words.some(w => has(text, w));

  // The department to suggest, or null when no symptom was described.
  function symptomDept(text) {
    const hits = SYMPTOMS.filter(([, words]) => any(text, words)).map(([d]) => d);
    if (!hits.length) return null;
    const specific = [...new Set(hits.filter(d => d !== 'gen'))];
    if (specific.length > 1) return { dept: 'gen', mixed: true };
    const dept = specific[0] || 'gen';
    if (dept === 'gen' && any(text, CHILD)) return { dept: 'peds', child: true };
    return { dept };
  }

  function freshData() {

  function bubble(side, text, opts = {}) {
    const d = make('div', 'msg ' + side + (opts.staff ? ' staff' : '') + (opts.urgent ? ' urgent' : ''));

  function clean(raw) {
    return ` ${raw.normalize('NFC').toLowerCase().replace(/[‘’]/g, "'").replace(/[?.,!؟،।:;()"]/g, ' ').replace(/\s+/g, ' ').trim()} `;
  }
  function route(raw) {
    const s = clean(raw);
    for (const [name, keys] of INTENTS) {
      if (name === 'symptom') {
        const info = symptomDept(s);
        if (info) { const med = any(s, INTENTS.find(i => i[0] === 'medical')[1]); return () => flows.symptom(info, med); }
        continue;
      }
      if (!any(s, keys)) continue;
      if (name === 'greet') return async () => { await bot(c().welcome); explain('start'); menu(); };
      if (name === 'staff') return () => flows.handover('staff');
      return flows[name];
    }
    return async () => { await bot(c().unknown); addQueue('unknown', false); explain('unknown'); menu(); };
  }

    renderStatic(); renderTier(); renderScen(); renderCompare(); renderClinic();
    chatLang = null;
    enqueue(flows.pickLang);
  }
  function setTier(n) { tier = n; restart(); }

  document.querySelectorAll('.langs button').forEach(b => { b.onclick = () => { lang = b.dataset.lang; try { localStorage.setItem('clinicSuiteLang', lang); } catch (e) {} restart(); }; });
  $('reset').onclick = restart;
  $('composer').addEventListener('submit', e => {
    e.preventDefault();
    const v = $('input').value.trim();
    if (!v) return;
    $('input').value = '';
    clearChips(); patient(v); m.chats++;
    const sl = scriptLang(v);
    if (sl && sl !== chatLang) chatLang = sl; else if (!chatLang) chatLang = lang;
    enqueue(route(v));
  });

  restart();
})();
</script>
</body>
</html>
